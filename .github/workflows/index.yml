name: Index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the checker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local media checking
        run: python -m pip install -r scripts/media-requirements.txt
      - name: Refuse to index mods that fail the checks
        run: node scripts/validate.mjs
      - name: Read the moderation list
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" moderation:moderation 2>/dev/null && git show moderation:moderation.json > "$RUNNER_TEMP/moderation.json" || echo '{}' > "$RUNNER_TEMP/moderation.json"
      - name: Build the index
        env:
          MAINTAINER_ID: "195697851"
        run: node scripts/build-index.mjs "$(git rev-parse HEAD)" "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/moderation.json"
      - name: Publish the index branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf publish && mkdir publish && cd publish
          git init -q -b index
          cp "$RUNNER_TEMP/index.json" index.json
          git add index.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: index $(git -C "$GITHUB_WORKSPACE" rev-parse --short=12 HEAD)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index:index
