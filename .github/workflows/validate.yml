name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the maintainer copy of the checks
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- scripts allowed-hosts.json types package.json package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the checker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: hashFiles('scripts/media-requirements.txt') != ''
        with:
          python-version: '3.12'
      - name: Install local media checking
        if: hashFiles('scripts/media-requirements.txt') != ''
        run: python -m pip install -r scripts/media-requirements.txt
      - name: Test local media checking
        if: hashFiles('scripts/media-requirements.txt') != ''
        run: python scripts/media-check.test.py
      - name: Check every mod
        run: node scripts/validate.mjs
