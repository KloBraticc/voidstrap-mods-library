name: Review

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: review-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && !startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read the moderation list
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" moderation:moderation 2>/dev/null && git show moderation:moderation.json > "$RUNNER_TEMP/moderation.json" || echo '{}' > "$RUNNER_TEMP/moderation.json"
      - name: Review the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_ID: "195697851"
          MAINTAINER_LOGIN: KloBraticc
          MODERATION_FILE: ${{ runner.temp }}/moderation.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_REVIEW_KEY: ${{ secrets.AI_REVIEW_KEY }}
          AI_REVIEW_URL: ${{ vars.AI_REVIEW_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_FALLBACK_MODEL: ${{ vars.AI_REVIEW_FALLBACK_MODEL }}
          AI_REVIEW_LANGUAGE: ${{ vars.AI_REVIEW_LANGUAGE }}
        run: node scripts/review.mjs
